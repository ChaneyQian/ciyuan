<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>词源 · 字溯其源，声律成境</title>
<meta name="description" content="写一个字，看它从楷书一路退回甲骨文，再活成它所画的那件东西。词库取自《声律启蒙》，乐声以中式乐器合成。">
<meta name="theme-color" content="#ece6d8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='8' fill='%23b0241e'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23f6ecdc' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23f6ecdc'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/style.css?v=4dd628ec">
</head>
<body>
  <canvas id="ink" aria-hidden="true"></canvas>
  <canvas id="stage" aria-label="词源画布：打字或点选下方的字，字会活过来"></canvas>

  <header class="brand">
    <div class="seal" aria-label="词源"><span>词</span><span>源</span></div>
    <p class="motto">字溯其源<i>·</i>声律成境</p>
  </header>

  <nav class="tools" aria-label="工具">
    <button id="btn-scroll" type="button" aria-pressed="false" aria-haspopup="true" data-tip="古文演成手卷" aria-label="词话：把一篇古文演成一幅手卷">词话</button>
    <button id="btn-auto" type="button" aria-pressed="false" data-tip="它自己写成画" aria-label="自在：让《声律启蒙》自己写一阕，你一动笔它就停">自在</button>
    <button id="btn-trace" type="button" aria-pressed="false" data-tip="字形退回甲骨文" aria-label="溯源：字形从楷书倒退回甲骨文，再化形">溯源</button>
    <button id="btn-hand" type="button" aria-pressed="false" data-tip="手写一个字" aria-label="造字（手写）：在纸上写一个字，停笔后由程序判定">造字</button>
    <button id="btn-pinyin" type="button" aria-pressed="false" data-tip="敲拼音出字" aria-label="拟声（拼音）：不用系统输入法，直接敲拼音出字">拟声</button>
    <button id="btn-sound" type="button" aria-pressed="false" data-tip="开 / 关声音" aria-label="传音（声音）：古琴、古筝、琵琶、笛箫、编钟">传音</button>
    <button id="btn-shot" type="button" data-tip="存一张画" aria-label="留影：存一张画">留影</button>
  </nav>

  <aside class="verse" id="verse" aria-live="polite"></aside>
  <div class="pair" id="pair" aria-live="polite"></div>

  <footer class="dock">
    <div class="chars" id="chars" role="toolbar" aria-label="可以活过来的字"></div>
    <p class="hint"><span id="hint-mode"></span><b data-ink="0" class="on">1 墨</b> <b data-ink="1">2 朱</b> <b data-ink="2">3 青</b></p>
  </footer>

  <!-- 左下角：撤销与图层 -->
  <div id="side" aria-label="撤销与图层">
    <button id="btn-undo" type="button" data-tip="撤销上一步（Ctrl+Z）" aria-label="撤销上一步">撤销</button>
    <button id="btn-bake" type="button" data-tip="把上层的物象压进底层" aria-label="固化：把上层的物象压进底层">固化</button>
    <button id="btn-box" type="button" aria-pressed="false" data-tip="拉框选中几样东西，再一起拖动（也可按住 Alt 拖）" aria-label="框选：拉框选中几样东西，再一起拖动">框选</button>
    <span id="lay-top" class="lay" title="上层：新落的字都在这一层，可以点选、清除、撤销"></span>
    <button id="lay-bg" type="button" class="lay" aria-pressed="true" data-tip="底层锁着：清不掉、选不中。点一下开锁" aria-label="底层：固化了的物象；点一下切换锁定"></button>
  </div>

  <!-- 首次进入的引导：蒙版上给真实的按键开窗，每个键拉一条引线到一句说明。只出现一次 -->
  <div id="guide" role="dialog" aria-label="怎么玩：每个按键的功能">
    <svg id="guide-svg" aria-hidden="true"></svg>
    <button type="button" id="guide-ok">开始</button>
  </div>

  <div id="vols" role="menu" aria-label="人间词话 · 选一卷"></div>
  <div id="shint" role="dialog" aria-label="怎么看这卷画">
    <div class="how">
      <div class="way"><span class="mouse"><i></i></span><span class="or">或</span><span class="keys"><kbd>←</kbd><kbd>→</kbd></span></div>
      <p class="say"><span class="kbd-way">滚动滚轮，或按左右方向键</span><span class="touch-way">点卷下的段名</span></p>
      <p class="what">拉动画卷，左右移动</p>
      <p class="rule">原文里空着的字，要你来补：<b>写</b>在画上，或<b>选</b>一个，或<b>描</b>画里的古字。<br>补上了，画才往下走。</p>
      <button type="button" id="shint-ok">知道了</button>
    </div>
  </div>
  <div id="swrong" aria-live="polite"></div>
  <div id="py" aria-live="polite"></div>
  <input id="ime" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="在此输入汉字" tabindex="-1">
  <noscript><p class="noscript">词源需要 JavaScript 与 WebGL。</p></noscript>

  <script src="js/shenglv-data.js?v=275bfe87"></script>
  <script src="js/luoshen-data.js?v=2976c10c"></script>
  <script src="js/pipa-data.js?v=7a8105b0"></script>
  <script src="js/chunjiang-data.js?v=b7980ba3"></script>
  <script src="js/glyph-data.js?v=0286c410"></script>
  <script src="js/fluid.js?v=72cf3095"></script>
  <script src="js/world.js?v=24db61e2"></script>
  <script src="js/flora.js?v=6ab6ee6e"></script>
  <script src="js/fauna.js?v=2e4459ff"></script>
  <script src="js/things.js?v=8179031e"></script>
  <script src="js/extras.js?v=ac067b6c"></script>
  <script src="js/wanxiang.js?v=5320e344"></script>
  <script src="js/lexicon.js?v=5f0d1365"></script>
  <script src="js/glyph.js?v=0ce40cee"></script>
  <script src="js/hand.js?v=f377a0f7"></script>
  <script src="js/audio.js?v=0b719bcc"></script>
  <script src="js/scroll.js?v=415c3196"></script>
  <script src="js/luoshen.js?v=772ae450"></script>
  <script src="js/pipa.js?v=0d6caae2"></script>
  <script src="js/chunjiang.js?v=6dac43b8"></script>
  <script src="js/eggs.js?v=6490e944"></script>
  <script src="js/main.js?v=40f9a004"></script>
</body>
</html>
